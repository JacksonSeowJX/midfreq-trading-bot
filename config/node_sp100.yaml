# The trading node configured as the S&P 100 forward test (docs/LIVE_ARCHITECTURE.md).
#
# Reproduces what ops/run_sp100_forward_test.sh runs on the original engine:
#   midfreq.live.run_live --strategy "Cross-Sectional Reversal" --symbols <98 symbols>
#     --timeframe 1h --sizing equal-dollar --basket-size <top_n> --capital <capital>
#     --stop-loss 0 --max-drawdown 15 --params lookback=.. top_n=.. rebalance_every=..
# with the symbols, parameters and capital read from config/sp100_forward_test.json, as the
# launcher reads them, so the two cannot drift apart. US commission 0.005% per side. Orders are
# marketable limits 1% through the last price, cancelled if not filled within 30 s.
#
# Mode is `shadow` here on purpose: the forward test trades on the original engine until it ends
# (about 13 November 2026) and its state file must have one writer. A shadow node writes to
# live_sessions/shadow/ (starting from the live state, read only) and never sends an order.
# It must not run while the forward test runs: both subscribing to the same 98 symbols would
# exceed the account's 100-instrument quote quota. Check it with:
#   midfreq-node check-config --config config/node_sp100.yaml

node:
  name: sp100
  mode: shadow
  timeframe: 1h
  heartbeat_s: 300
  reconcile_s: 300            # the original engine's sync_with_broker interval
  stall_factor: 1.25          # no closed bar for 75 minutes: resubscribe once, then stop
  stop_order_wait_s: 30
  console_tz: Asia/Singapore
  console_tz_label: SGT
  market_tz: America/New_York
  market_tz_label: ET

connectors:
  moomoo: {}                  # OpenD host and port from config/connections.yaml

data:
  connector: moomoo
  quotes: false               # bars only, as the original engine (quotes would cost quote quota)

accounts:
  moomoo-us:
    connector: moomoo
    options: {market: US}     # trading_env (paper) comes from config/connections.yaml
    environment: paper

strategies:
  - id: sp100-xsr
    class: Cross-Sectional Reversal
    from: config/sp100_forward_test.json      # params, symbols and capital
    account: moomoo-us
    timeframe: 1h
    commission_rate: 0.00005
    risk_manager:
      stop_loss_pct: 0        # none: the validated studies ran without a per-position stop
      take_profit_pct: 0
      max_drawdown_pct: 0.15  # the account drawdown halt, a safety net only
      sizing: equal-dollar    # basket size: the strategy's top_n
    pricing:
      rule: last              # the latest pushed price, 1% through it (place_and_confirm's slip)
      slip: 0.01
      time_in_force: DAY
    warmup_bars: 60
    confirm_fills: true       # wait for each order's outcome, as the original engine did
    confirm_timeout_s: 75

# Pre-trade risk (midfreq.trading.risk). At US$100,000 over 3 names each holding is ~US$33,300.
risk:
  max_order_value: 50000
  max_position_value: 50000
  price_band_pct: 0.05        # a limit more than 5% from the last price is a fat finger
  require_session_open: true

# Orders left unfilled (midfreq.trading.oms): the original engine waited 30 s, cancelled, and
# waited up to 30 s more for the final status, with no retry.
oms:
  unfilled_order:
    wait_s: 30
    reprice_attempts: 0
    reprice_from: quote
    cancel_wait_s: 30

marketdata:
  min_cross_section_share: 0.9
  finality_grace_s: 30

shadow:
  fill_mode: none             # `quote`: simulated fills at the quote, in the shadow records only
