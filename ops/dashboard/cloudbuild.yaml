# Cloud Build: the dashboard image (ops/dashboard/deploy_dashboard.sh passes _IMAGE).
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "ops/dashboard/Dockerfile", "--build-arg", "GIT_COMMIT=${_COMMIT}", "-t", "${_IMAGE}", "."]
images: ["${_IMAGE}"]
options:
  logging: CLOUD_LOGGING_ONLY
