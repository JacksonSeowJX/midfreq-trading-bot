[project]
name = "midfreq-live"
version = "0.1.0"
description = "Live trading: the live engine and the broker order gateway."
requires-python = ">=3.11"
dependencies = ["midfreq-core", "midfreq-data", "midfreq-strategies", "pandas>=2.1", "moomoo-api"]

[tool.uv.sources]
midfreq-core = { workspace = true }
midfreq-data = { workspace = true }
midfreq-strategies = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/midfreq"]
