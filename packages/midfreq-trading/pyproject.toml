[project]
name = "midfreq-trading"
version = "0.1.6"
description = "The live trading node: OMS, pre-trade risk, positions, market data and reference data services, wired to venues through connectors."
requires-python = ">=3.10"
dependencies = ["midfreq-core", "midfreq-data", "midfreq-strategies", "pandas>=2.1"]

[project.scripts]
midfreq-node = "midfreq.trading.cli:main"

[tool.uv.sources]
midfreq-core = { workspace = true }
midfreq-data = { workspace = true }
midfreq-strategies = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/midfreq"]
