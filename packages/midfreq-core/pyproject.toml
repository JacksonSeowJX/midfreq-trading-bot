[project]
name = "midfreq-core"
version = "0.1.0"
description = "Domain model shared by every package: candles and the venue/instrument/order/event model, portfolio and risk rules, venues, paths and connection settings."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "pydantic>=2", "pyyaml>=6", "python-dotenv>=0.21", "pytz"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/midfreq"]
