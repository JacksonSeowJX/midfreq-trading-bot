[project]
name = "midfreq-strategies"
version = "0.1.2"
description = "Trading strategies: the candle-based strategy library and registry, and the event-driven Strategy API with native strategies."
requires-python = ">=3.10"
dependencies = ["midfreq-core", "numpy>=1.26", "pandas>=2.1"]

[project.optional-dependencies]
hmm = ["hmmlearn", "scikit-learn"]

[tool.uv.sources]
midfreq-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/midfreq"]
