[project]
name = "midfreq-research"
version = "0.1.6"
description = "Research tools: overfitting (PBO), White's Reality Check, the results index and the forward-test read-back."
requires-python = ">=3.10"
dependencies = ["midfreq-core", "midfreq-data", "midfreq-strategies", "midfreq-backtest", "numpy>=1.26", "pandas>=2.1", "statsmodels"]

[tool.uv.sources]
midfreq-core = { workspace = true }
midfreq-data = { workspace = true }
midfreq-strategies = { workspace = true }
midfreq-backtest = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/midfreq"]
