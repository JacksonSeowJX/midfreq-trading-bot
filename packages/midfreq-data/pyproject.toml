[project]
name = "midfreq-data"
version = "0.1.3"
description = "Market data: connectors (Moomoo, IBKR, yfinance, Binance, ccxt), the legacy Parquet cache and the Parquet data catalog, and the fetch command line."
requires-python = ">=3.10"
dependencies = ["midfreq-core", "pandas>=2.1", "pyarrow>=14", "requests>=2.31"]

[project.optional-dependencies]
moomoo = ["moomoo-api"]
ibkr = ["ib-insync"]
yfinance = ["yfinance"]
crypto = ["ccxt>=4"]

[tool.uv.sources]
midfreq-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/midfreq"]
