[project]
name = "midfreq-api"
version = "0.1.0"
description = "The dashboard's HTTP API: read-only views of research results, the trading bot's record and broker accounts."
requires-python = ">=3.10"
dependencies = ["midfreq-core", "midfreq-data", "midfreq-strategies", "midfreq-backtest", "midfreq-research", "fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
# the record in a Cloud Storage bucket (GcsMirrorRecordStore), for the hosted dashboard
gcs = ["google-cloud-storage>=2"]

[tool.uv.sources]
midfreq-core = { workspace = true }
midfreq-data = { workspace = true }
midfreq-strategies = { workspace = true }
midfreq-backtest = { workspace = true }
midfreq-research = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/midfreq"]
