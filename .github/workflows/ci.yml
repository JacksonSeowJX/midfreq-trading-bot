# Continuous integration. Two environments, because they really are different:
#
#   research  Python 3.12 with the versions in uv.lock, the ones every reported result was
#             produced with (the Mac's Anaconda). Also checks the package layering.
#   vm        Python 3.10 with ops/vm/requirements-vm.txt, the versions the live engine runs
#             on the GCP VM: builds the release bundle, installs it exactly as
#             ops/vm/install_release.sh does on the VM, and runs the tests against it.
#
# The VM's daily session-log commits touch only live_sessions/ and are skipped.
name: CI

on:
  push:
    paths-ignore: ["live_sessions/**"]
  pull_request:
    paths-ignore: ["live_sessions/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  research:
    name: research (Python 3.12, uv.lock)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install the workspace
        run: uv sync --locked
      - name: Tests
        run: uv run pytest -q -p no:cacheprovider
      - name: Package layers
        run: uv run lint-imports

  vm:
    name: vm (Python 3.10, the release bundle as the VM installs it)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Build the bundle
        run: ./ops/build_release.sh
      - name: Install it as the VM would (smoke test and launcher dry run included)
        run: |
          mkdir -p "$RUNNER_TEMP/midfreq/runtime"
          cp -R config "$RUNNER_TEMP/midfreq/runtime/"
          MIDFREQ_HOME="$RUNNER_TEMP/midfreq" PYTHON_BASE=python3.10 \
            ./ops/vm/install_release.sh dist/midfreq-*.tar.gz
      - name: Tests against the installed release
        run: |
          rm -rf packages/*/src      # import the installed wheels, not the source tree
          "$RUNNER_TEMP/midfreq/current/.venv/bin/python" -m pytest -q -p no:cacheprovider

  # The dashboard front end (apps/web): Node 22 LTS, the versions in its package-lock.json.
  # Its API types must be regenerated from apps/api/openapi.json whenever the contract changes.
  web:
    name: web (Node 22, apps/web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: API types match apps/api/openapi.json
        run: |
          npm run gen:api
          if [ -n "$(git status --porcelain -- src/api/schema.d.ts)" ]; then
            echo "::error::src/api/schema.d.ts is out of date: run 'npm run gen:api' in apps/web and commit it"
            git diff -- src/api/schema.d.ts
            exit 1
          fi
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test -- --run
      - name: Build
        run: npm run build
