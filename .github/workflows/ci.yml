# Continuous integration. Two environments, because they really are different:
#
#   research  Python 3.12 with the versions in uv.lock, the ones every reported result was
#             produced with (the Mac's Anaconda). Also checks the package layering.
#   vm        Python 3.10 with ops/vm/requirements-vm.txt, the versions the live engine runs
#             on the GCP VM. The VM deploys a commit only after this workflow has passed on it
#             (see ops/vm/ci_gate.sh), so this job is the deployment gate.
#
# The VM's daily session-log commits touch only live_sessions/ and are skipped.
name: CI

on:
  push:
    paths-ignore: ["live_sessions/**"]
  pull_request:
    paths-ignore: ["live_sessions/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  research:
    name: research (Python 3.12, uv.lock)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install the workspace
        run: uv sync --locked
      - name: Tests
        run: uv run pytest -q -p no:cacheprovider
      - name: Package layers
        run: uv run lint-imports

  vm:
    name: vm (Python 3.10, live versions)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: ops/vm/requirements-vm.txt
      - name: Install as the VM does
        run: |
          python -m pip install -r ops/vm/requirements-vm.txt
          python -m pip install --no-deps $(for p in packages/*/; do printf -- '-e %s ' "$p"; done)
      - name: Tests
        run: python -m pytest -q -p no:cacheprovider
      - name: Launcher dry run
        run: DRY_RUN=1 FAKE_ET=2026-11-16T09:35:01 PYTHON=python ./ops/run_sp100_forward_test.sh --scheduled
