# Release: build the bundle the VM runs, prove it installs and passes the tests exactly as it
# will on the VM, and publish it as a GitHub Release tagged vX.Y.Z. Two ways to start it:
#
#   - Actions tab -> Release -> Run workflow, on main, with the version (X.Y.Z). The tag is
#     created on that commit when the release is published.
#   - push a tag:  git tag -a vX.Y.Z -m "..." && git push origin vX.Y.Z
#
# Either way the packages must already carry that version (ops/set_version.sh X.Y.Z, commit).
#
# Deploying is a separate, manual step: ops/deploy.sh vX.Y.Z (see ops/README.md).
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, X.Y.Z (must match the packages' pyproject.toml)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # vX.Y.Z from the pushed tag, or from the version typed into "Run workflow"
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"        # the VM's interpreter

      - name: Version matches the packages, and is not released yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not vX.Y.Z: $TAG"; exit 1; }
          v="${TAG#v}"
          bad=$(grep -L "^version = \"$v\"" pyproject.toml packages/*/pyproject.toml || true)
          [ -z "$bad" ] || { echo "$TAG but these files say otherwise (run ops/set_version.sh $v): $bad"; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1; then echo "$TAG is already released"; exit 1; fi

      - name: Build the bundle
        run: ./ops/build_release.sh

      - name: Install it as the VM would
        run: |
          mkdir -p "$RUNNER_TEMP/midfreq/runtime"
          cp -R config "$RUNNER_TEMP/midfreq/runtime/"
          MIDFREQ_HOME="$RUNNER_TEMP/midfreq" PYTHON_BASE=python3.10 \
            ./ops/vm/install_release.sh "dist/midfreq-${TAG#v}.tar.gz"

      - name: Tests against the installed release
        run: |
          rm -rf packages/*/src      # import the installed wheels, not the source tree
          # the VM bundle's packages and the cross-package tests; apps/api is not on the VM
          "$RUNNER_TEMP/midfreq/current/.venv/bin/python" -m pytest -q -p no:cacheprovider packages tests

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${TAG#v}"
          # --target: from "Run workflow" the tag does not exist yet and is created on this commit
          gh release create "$TAG" "dist/midfreq-$v.tar.gz" "dist/midfreq-$v.tar.gz.sha256" \
            --target "$GITHUB_SHA" --title "$TAG" --generate-notes
